site_name: netboot.xyz for Mere Mortals
site_description: Network booting a menu of operating system installers and rescue tools with iPXE. The boot files and their checksums, the menu read line by line, self hosting the web assets, USB and ISO media, and the DHCP settings that offer the menu to a whole network, with the limits stated plainly.
